<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ezozam ❤️‍🔥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF6F0;
    --blush:#F6D9DD;
    --rose:#D98A9A;
    --wine:#7A1F3A;
    --wine-deep:#5C1329;
    --gold:#C79A56;
    --ink:#3A1620;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:radial-gradient(circle at 50% 0%, var(--blush) 0%, var(--cream) 55%, #FBEDE6 100%);
    font-family:'Manrope', sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }

  .phone-wrap{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
    position:relative;
  }

  /* ambient petals — few, slow */
  .petal{
    position:fixed;
    top:-40px;
    width:14px;
    height:14px;
    background:var(--rose);
    opacity:0.35;
    border-radius:0 60% 0 60%;
    pointer-events:none;
    animation:fall linear infinite;
    z-index:0;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.35; }
    90%{ opacity:0.25; }
    100%{ transform:translateY(110vh) rotate(220deg); opacity:0; }
  }

  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    background:#FFFDFB;
    border-radius:28px;
    padding:38px 26px 32px;
    box-shadow:0 18px 50px -12px rgba(122,31,58,0.28), 0 0 0 1px rgba(199,154,86,0.15);
    text-align:center;
    overflow:hidden;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:28px;
    padding:1px;
    background:linear-gradient(135deg, rgba(199,154,86,0.5), rgba(217,138,154,0.15) 40%, transparent 70%);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
  }

  .glow{
    position:absolute;
    top:-60px;
    left:50%;
    transform:translateX(-50%);
    width:220px;
    height:220px;
    background:radial-gradient(circle, rgba(217,138,154,0.45), transparent 70%);
    filter:blur(6px);
    animation:breathe 5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{ opacity:0.55; transform:translateX(-50%) scale(1); }
    50%{ opacity:0.9; transform:translateX(-50%) scale(1.12); }
  }

  .icon-heart{
    font-size:26px;
    margin-bottom:14px;
    display:inline-block;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.15); }
  }

  .poem{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:22px;
    line-height:1.55;
    color:var(--wine-deep);
    margin:0 0 22px;
    white-space:pre-line;
    letter-spacing:0.2px;
  }

  .divider{
    width:46px;
    height:2px;
    margin:0 auto 22px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .headline{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:28px;
    color:var(--wine);
    margin:0 0 26px;
    line-height:1.3;
  }

  .btn-row{
    display:flex;
    gap:14px;
    justify-content:center;
    margin-top:6px;
  }

  .btn{
    flex:1;
    max-width:140px;
    padding:13px 0;
    border-radius:999px;
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.3px;
    border:none;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:active{ transform:scale(0.96); }

  .btn-yes{
    background:linear-gradient(135deg, var(--wine), var(--wine-deep));
    color:#FBEDE6;
    box-shadow:0 8px 20px -6px rgba(122,31,58,0.55);
  }

  .btn-no{
    background:transparent;
    color:var(--wine);
    border:1.5px solid var(--rose);
  }

  .sticker{
    font-size:34px;
    margin-top:16px;
    height:0;
    opacity:0;
    overflow:hidden;
    transition:opacity 0.35s ease, height 0.35s ease, margin 0.35s ease;
  }
  .sticker.show{
    opacity:1;
    height:46px;
    margin-top:16px;
    animation:shake 0.5s ease;
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }

  /* state transition */
  .state{
    transition:opacity 0.45s ease, transform 0.45s ease;
  }
  .state.leaving{
    opacity:0;
    transform:translateY(-10px);
  }
  .state.hidden{
    display:none;
  }
  .state.entering{
    opacity:0;
    transform:translateY(10px);
  }

  .date-input{
    width:100%;
    padding:14px 16px;
    border-radius:16px;
    border:1.5px solid var(--blush);
    background:var(--cream);
    font-family:'Manrope', sans-serif;
    font-size:16px;
    color:var(--ink);
    margin-bottom:18px;
    outline:none;
  }
  .date-input:focus{
    border-color:var(--rose);
  }

  .btn-send{
    width:100%;
    padding:14px 0;
    border-radius:999px;
    background:linear-gradient(135deg, var(--wine), var(--wine-deep));
    color:#FBEDE6;
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:15.5px;
    border:none;
    cursor:pointer;
    box-shadow:0 8px 20px -6px rgba(122,31,58,0.5);
    transition:transform 0.15s ease;
  }
  .btn-send:active{ transform:scale(0.97); }

  .after-msg{
    margin-top:20px;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:19px;
    color:var(--wine-deep);
    opacity:0;
    height:0;
    overflow:hidden;
    transition:opacity 0.4s ease, height 0.4s ease, margin 0.4s ease;
  }
  .after-msg.show{
    opacity:1;
    height:auto;
    margin-top:20px;
  }

  .sound-toggle{
    position:fixed;
    top:18px;
    right:18px;
    width:40px;
    height:40px;
    border-radius:50%;
    background:#FFFDFB;
    border:1px solid var(--blush);
    box-shadow:0 6px 16px -6px rgba(122,31,58,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    cursor:pointer;
    z-index:10;
  }
</style>
</head>
<body>

<div class="sound-toggle" id="soundToggle" title="Musiqa">🎵</div>

<audio id="bgMusic" loop preload="auto">
  <source src="./Oshiq-yurak.mp3" type="audio/mpeg">
</audio>

<div class="phone-wrap">
  <div class="card">
    <div class="glow"></div>

    <!-- STATE 1 -->
    <div class="state" id="state1">
      <div class="icon-heart">❤️‍🔥</div>
      <p class="poem">Bunchalar go'zalsan arazing bilan
Lov etib yonasan, kuyadigan men.
Barcha erkaliging g'azabing bilan
Telbadek boringcha sevadigan men</p>
      <div class="divider"></div>
      <h1 class="headline">Kechiring Ezozam ❤️‍🔥</h1>

      <div class="btn-row">
        <button class="btn btn-yes" id="btnYes">Ha</button>
        <button class="btn btn-no" id="btnNo">Yo'q</button>
      </div>

      <div class="sticker" id="sticker">🥹🥹🥹</div>
    </div>

    <!-- STATE 2 -->
    <div class="state hidden" id="state2">
      <div class="icon-heart">😉</div>
      <h1 class="headline">Hoosh endi qachon uyimda ko'rishamiz taxminiy sanani belgilang 😁😉</h1>

      <input type="date" class="date-input" id="dateInput">
      <button class="btn-send" id="btnSend">Jo'natish</button>

      <div class="after-msg" id="afterMsg">Endi shu joyida screenshot tashlab yuboring jonim 😁</div>
    </div>

  </div>
</div>

<script>
  // ambient petals — kept minimal
  const wrap = document.querySelector('.phone-wrap');
  for(let i=0;i<5;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = (Math.random()*90+5) + 'vw';
    p.style.animationDuration = (10 + Math.random()*8) + 's';
    p.style.animationDelay = (Math.random()*10) + 's';
    document.body.appendChild(p);
  }

  // music handling — browsers block autoplay with sound until a user gesture
  const music = document.getElementById('bgMusic');
  const soundToggle = document.getElementById('soundToggle');
  let musicStarted = false;

  function tryStartMusic(){
    if(musicStarted) return;
    music.play().then(()=>{
      musicStarted = true;
      soundToggle.textContent = '🎵';
    }).catch(()=>{ /* will retry on next interaction */ });
  }

  document.body.addEventListener('click', tryStartMusic, { once:false });

  soundToggle.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(music.paused){
      music.play().then(()=>{ soundToggle.textContent = '🎵'; musicStarted = true; }).catch(()=>{});
    } else {
      music.pause();
      soundToggle.textContent = '🔇';
    }
  });

  // Yo'q button
  const sticker = document.getElementById('sticker');
  document.getElementById('btnNo').addEventListener('click', ()=>{
    sticker.classList.remove('show');
    void sticker.offsetWidth; // restart animation
    sticker.classList.add('show');
  });

  // Ha button — transition to state 2
  const state1 = document.getElementById('state1');
  const state2 = document.getElementById('state2');

  document.getElementById('btnYes').addEventListener('click', ()=>{
    state1.classList.add('leaving');
    setTimeout(()=>{
      state1.classList.add('hidden');
      state2.classList.remove('hidden');
      state2.classList.add('entering');
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          state2.classList.remove('entering');
        });
      });
    }, 450);
  });

  // Jo'natish button
  const afterMsg = document.getElementById('afterMsg');
  document.getElementById('btnSend').addEventListener('click', ()=>{
    const val = document.getElementById('dateInput').value;
    if(!val){
      document.getElementById('dateInput').focus();
      return;
    }
    afterMsg.classList.add('show');
  });
</script>

</body>
</html>
